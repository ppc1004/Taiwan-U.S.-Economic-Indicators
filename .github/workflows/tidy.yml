name: One-time tidy up

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move original files and remove duplicate folder
        run: |
          mkdir -p data/original
          find . -maxdepth 1 -type f \( -name '*.xlsx' -o -name '*.xls' -o -name '*.ipynb' \) -print0 |
            while IFS= read -r -d '' f; do git mv "$f" data/original/; done
          git rm -r -q taiwan-us-economic-indicators
          git rm -q .github/workflows/tidy.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move original data and notebooks into data/original"
          git push
