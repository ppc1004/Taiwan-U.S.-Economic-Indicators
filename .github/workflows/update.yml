name: Monthly update

on:
  schedule:
    - cron: "17 14 * * 1"   # every Monday 14:17 UTC; files only change when new data has come out
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download U.S. data from FRED
        run: python scripts/fetch_fred.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Download Taiwan's official light (NDC)
        run: python scripts/fetch_taiwan_light.py
        continue-on-error: true
      - name: Calculate U.S. light
        run: python scripts/build_us_light.py
      - name: Build Taiwan light
        run: python scripts/build_taiwan_light.py
        continue-on-error: true
      - name: Build trade chapter
        run: python scripts/build_taiwan_trade.py
      - name: Build products chapter
        run: python scripts/build_taiwan_products.py
      - name: Build orders and investment chapters
        run: python scripts/build_taiwan_orders_investment.py
      - name: Build industry chapter
        run: python scripts/build_taiwan_industry.py
      - name: Save new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch data/us_light.json data/taiwan_ndc_raw.csv
          git add data docs
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%d)"
          git push
